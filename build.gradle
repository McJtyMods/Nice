buildscript {
    repositories {
        maven { url = 'https://maven.firstdark.dev/releases' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.hypherionmc.modutils:modpublisher:2.2.1'
    }
}

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.39'
}

apply plugin: 'com.hypherionmc.modutils.modpublisher'

// Integrated workspaces supply the shared script; standalone builds use the published branch.
def sharedTools = rootProject.file('gradletools.gradle')
if (rootProject != project && sharedTools.isFile()) {
    apply from: sharedTools
} else {
    apply from: 'https://raw.githubusercontent.com/McJtyMods/MultiWorkspace/26.3_neo/gradletools.gradle'
}

group = "com.github.mcjty"
base { archivesName = "nice" }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repos()
runs()
jars()

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    mc()
    top()
    jei()
    mcjtylib()
}

modpublisher([], ['mcjtylib'], [], ['mcjtylib'], [])

// In-world migration checks are compiled only when explicitly requested.
if (project.hasProperty('portTests')) {
    sourceSets.main.java.srcDir 'src/portTest/java'
    extensions.getByName("runs").named("gameTestServer") {
        arguments.addAll '--test', 'nice:*'
    }
}

if (project.hasProperty('clientSmoke')) {
    if (!project.hasProperty('portTests')) throw new GradleException('clientSmoke requires -PportTests')
    extensions.getByName("runs").named("client") {
        systemProperty 'nice.clientSmoke', 'true'
        arguments.addAll '--quickPlaySingleplayer', 'nice-port-smoke'
    }
}
